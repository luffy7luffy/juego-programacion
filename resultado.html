<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resultado</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <h1>¡Reto completado!</h1>
  <p id="mentor"></p>
  <p>XP total: <span id="xp">0</span> · Racha: <span id="racha">0</span> días</p>
  <button id="siguiente" style="display:none">Siguiente reto</button>
  <button onclick="location.href='mapa.html'">Volver al mapa</button>

  <script src="datos/retos-html.js"></script>
  <script src="js/mentor.js"></script>
  <script src="js/progreso.js"></script>
  <script>
    document.getElementById("mentor").textContent = mentor.nombre + ": " + mentor.acierto;
    document.getElementById("xp").textContent = leerXP();
    document.getElementById("racha").textContent = leerRacha();

    const params = new URLSearchParams(location.search);
    const actual = Number(params.get("n")) || 0;
    if (actual > 0 && actual < retos.length) {
      const boton = document.getElementById("siguiente");
      boton.style.display = "block";
      boton.onclick = function () {
        location.href = "reto.html?n=" + (actual + 1);
      };
    }
  </script>
</body>
</html>
